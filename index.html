<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendZ - Login</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700;800&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=21">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js?v=2"></script>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Left Side: Illustration & Text -->
            <div class="login-left">
                <!-- Fun Gen Z Graphic -->
                <div class="decor decor-1"></div>
                <div class="decor decor-2"></div>
                <div class="decor decor-3"></div>
                <div class="decor decor-circle-bg"></div>
                
                <img src="genz_illustration.png" alt="Holographic Vibe Illustration" class="illustration-img">
                
                <div class="left-text">
                    <h2>Vibe Check Your Money.</h2>
                    <p>No cap, tracking your expenses just got actually aesthetic. ✨</p>
                </div>
            </div>

            <!-- Right Side: Login Form -->
            <div class="login-right">
                <div class="login-logo">
                    <span class="logo-text-gradient">SpendZ ✨</span>
                </div>
                
                <h3>Drop In</h3>
                <p class="login-subtitle">Sign in to keep your streaks alive and track your bags 💰</p>

                <div class="alert-box" id="generalError" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="generalErrorText">Error message here</span>
                </div>

                <button class="btn-google-new" id="googleBtn" onclick="tryGoogleLogin()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" alt="G">
                    Continue with Google
                </button>

                <div class="divider-new">
                    <span>or drop an email</span>
                </div>

                <div class="input-wrapper">
                    <label>Email</label>
                    <input type="email" id="emailInput" class="input-new" placeholder="mail@abc.com" autocomplete="username">
                </div>

                <div class="input-wrapper">
                    <label>Password</label>
                    <input type="password" id="passwordInput" class="input-new" placeholder="*********" autocomplete="current-password">
                </div>

                <div class="login-options">
                    <label class="remember-cb">
                        <input type="checkbox"> <span class="checkmark"></span> Remember Me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button class="btn-primary-new" id="signInBtn" onclick="handleDirectLogin()">Login</button>

                <p class="register-text">
                    Not Registered Yet? <a href="#" onclick="showError('Just enter any email/pass to automatically sign up/in!', true)">Create an account</a>
                </p>
            </div>
            
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        // Check Session on Load
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                // Real session exists
                window.location.replace('dashboard.html');
            } else if (localStorage.getItem('spendzLoggedIn') === 'true' && localStorage.getItem('guest_mode') === 'true') {
                // Guest mode active
                window.location.replace('dashboard.html');
            }
        }
        checkSession();

        // === Logic ===
        const btn = document.getElementById('signInBtn');

        async function handleDirectLogin() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorBox = document.getElementById('generalError');
            const errorText = document.getElementById('generalErrorText');

            // Reset UI
            errorBox.style.display = 'none';
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Checking...';
            btn.disabled = true;

            if (!email || !password) {
                showError('Please fill in all fields.');
                resetBtn();
                return;
            }

            try {
                // 1. Try Real Login
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    // 2. If User Not Found (Invalid credentials), Try Sign Up automatically
                    if (error.message.includes('Invalid login credentials')) {
                        console.log("User not found, trying auto-signup...");
                        const { data: upData, error: upError } = await supabase.auth.signUp({
                            email,
                            password,
                            options: { data: { full_name: email.split('@')[0] } }
                        });

                        if (upError) throw upError;

                        // Signup Success
                        if (upData.session) {
                            window.location.href = 'dashboard.html';
                            return;
                        } else if (upData.user) {
                            // Email confirmation required?
                            showError("Account created! Please check your email to confirm.");
                            resetBtn();
                            return;
                        }
                    }
                    throw error; // Throw other errors (or original if not handled)
                }

                // Login Success
                window.location.href = 'dashboard.html';

            } catch (err) {
                console.warn("Supabase Login Failed:", err.message);

                // === FAILSAFE MODE ===
                // If Rate Limit or Invalid Login (and user clearly wants access), we let them in as Guest.
                // Or we can simulate a signup. 

                // For this "Pro" version, let's keep it clean:
                // If it's a "Rate Limit" error, we AUTO-BYPASS to Guest Mode.
                if (err.message.includes('rate limit')) {
                    enableGuestMode(email);
                    return;
                }

                showError(err.message);
                resetBtn();
            }
        }

        function enableGuestMode(email) {
            localStorage.setItem('spendzLoggedIn', 'true');
            localStorage.setItem('guest_mode', 'true'); // Flag for app.js
            localStorage.setItem('userEmail', email);

            btn.innerHTML = 'Switching to Offline Mode...';
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        }

        async function tryGoogleLogin() {
            const gBtn = document.getElementById('googleBtn');
            gBtn.innerHTML = 'Connecting...';
            try {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.href.replace('index.html', '') + 'dashboard.html' }
                });
                if (error) throw error;
            } catch (err) {
                console.error("Google Auth Error:", err);
                // Fallback to Guest Mode if not configured yet
                console.warn("Google Auth not fully configured. Falling back to Guest Mode.");
                enableGuestMode('google-guest@vibe.com');
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('generalError');
            const errorText = document.getElementById('generalErrorText');
            errorText.textContent = msg;
            errorBox.style.display = 'flex';
        }

        function resetBtn() {
            btn.disabled = false;
            btn.innerText = 'Sign In';
        }
        
        // Theme Toggle Logic
        function initTheme() {
            const savedTheme = localStorage.getItem('spendz_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('spendz_theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('#themeToggleBtn i');
            if (icon) {
                if (theme === 'dark') {
                    icon.className = 'fa-solid fa-sun';
                } else {
                    icon.className = 'fa-solid fa-moon';
                }
            }
        }
        
        // Initialize theme before rendering content
        initTheme();
        
        // Duplicate columns to fill the full screen background properly
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.querySelector('.scroll-container');
            if (container) {
                const colUp = document.querySelector('.scroll-column:not(.reverse)').outerHTML;
                const colDown = document.querySelector('.scroll-column.reverse').outerHTML;
                // Add 3 more columns for desktop full width
                container.innerHTML += colUp + colDown + colUp;
            }
        });
    </script>
    
    <!-- Floating Theme Toggle for Login Page -->
    <button onclick="toggleTheme()" id="themeToggleBtn" title="Toggle Theme" style="position: fixed; top: 20px; right: 20px; z-index: 1000; background: var(--bg-card); border: none; width: 45px; height: 45px; border-radius: 50%; box-shadow: var(--shadow-clay-sm); cursor: pointer; color: var(--text-gray); font-size: 1.2rem; transition: all 0.3s ease;">
        <i class="fa-solid fa-moon"></i>
    </button>
</body>

</html>
